# O Worker da IA do painel (ver ia.mjs): a pesquisa em linguagem natural, o assistente com ferramentas e a contagem do que se gasta.
# Publica-se com `npx wrangler deploy` dentro desta pasta, com o token e o identificador da conta Cloudflare nas variáveis
# CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID. A base de dados (D1) cria-se com `npx wrangler d1 create painel-ia` e o esquema aplica-se com
# `npx wrangler d1 execute painel-ia --remote --file=esquema.sql`.
name = "painel-ia"
main = "ia.mjs"
compatibility_date = "2026-10-01"
workers_dev = true

# A IA da Cloudflare (Workers AI): a camada gratuita chega para um painel; o Worker não precisa de nenhum segredo.
[ai]
binding = "AI"

# O histórico do que se gastou (só números).
[[d1_databases]]
binding = "DB"
database_name = "painel-ia"
database_id = "73b4110a-710c-4fc4-b457-366895e1d88e"

[vars]
# As origens do painel que podem perguntar, separadas por vírgulas. Mude para o endereço do seu painel.
ORIGENS = "https://simulador.ferreirakorp.com,http://localhost:3010"
# O modelo da pesquisa (opcional): um mais pequeno gasta menos da quota gratuita.
# MODELO = "@cf/meta/llama-3.1-8b-instruct-fp8"
# As neurons que se podem gastar por dia (por omissão 10 000, a quota gratuita da Cloudflare): passado isto o Worker recusa em vez de cobrar.
# NEURONS_POR_DIA = "10000"

# No máximo 90 pedidos por minuto e por IP (a pesquisa a fundo faz muitas chamadas pequenas).
[[ratelimits]]
name = "LIMITE"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 90
  period = 60
