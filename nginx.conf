server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

  # Cabeçalhos de segurança (o nginx não os herda para locais que definem os seus, por isso cada local inclui o mesmo ficheiro).
  include /etc/nginx/seguranca.conf;

  location = /saude {
    access_log off;
    default_type text/plain;
    include /etc/nginx/seguranca.conf;
    return 200 "ok";
  }

  # Ficheiros com nome único por versão: cache longa.
  location /_next/static/ {
    include /etc/nginx/seguranca.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Motor de OCR, idiomas e worker do PDF (copiados no postinstall): cache média.
  location /vendor/ {
    # O worker do PDF é um módulo .mjs, que o nginx não conhece: sem este tipo o navegador recusa-o.
    default_type text/javascript;
    include /etc/nginx/seguranca.conf;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # Autenticação: só responde quando o serviço «auth» está ligado (docker compose --profile auth up); sem ele devolve 503.
  location /api/auth/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $auth http://auth:8787;
    proxy_pass $auth;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    include /etc/nginx/seguranca.conf;
    add_header Cache-Control "no-store";
    error_page 502 503 504 = @auth_desligada;
  }
  location @auth_desligada {
    default_type application/json;
    include /etc/nginx/seguranca.conf;
    return 503 '{"ok":false,"erro":"A autenticação não está ligada neste ambiente."}';
  }

  location / {
    include /etc/nginx/seguranca.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
    include /etc/nginx/seguranca.conf;
  }
}
