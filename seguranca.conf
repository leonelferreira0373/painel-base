# Cabeçalhos de segurança comuns. O CSP permite o OCR (WebAssembly e workers do próprio domínio), a importação por endereço (https) e as letras que a pessoa liga por endereço https (folhas de estilos e ficheiros de letra).
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob:; font-src 'self' data: blob: https:; worker-src 'self' blob:; frame-src 'self' blob:; connect-src 'self' https: blob: data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
